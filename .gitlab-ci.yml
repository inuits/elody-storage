---
include:
  - project: "inuits/gitlab-ci/pipeline-templates"
    ref: "v4.20.4"
    file:
      - "pipelines/customers/deploy.yml"
      - "jobs/docker/build-pip.yml"
    # file:
    #   - "/pipelines/customers/dams/deliver-multi-customer.yml"
    #   - "/jobs/docker/build-pip.yml"

# variables:
#   PROJECT: 'dams'
#   APPLICATION: 'storage'
#
#   HARBOR_PROJECT_DEV: elody-dams-dev
#
# customers:
#   parallel:
#     matrix:
#       - CUSTOMER:
#         - amvb
#         - coghent
#         - digipolis
#         - vliz
#         - imec
#
variables:
  CUSTOMER: inuits
  PROJECT: dams
  APPLICATION: storage

  SKIP_DEPLOY: "true"

  HARBOR_PROJECT_DEV: elody-dams-dev
  TARGET_CLUSTER_DEV: inuits-prod
  UV_IMAGE_PREFIX: kearblx6.c1.gra9.container-registry.ovh.net/ghcr

# --------------------------------------------------------------
# Template overrides
# --------------------------------------------------------------

.build:
  variables:
    # PODMAN_EXTRA_FLAGS: --build-arg UV_IMAGE_PREFIX=${UV_IMAGE_PREFIX}
    DOCKER_EXTRA_BUILD_FLAGS: --build-arg UV_IMAGE_PREFIX=${UV_IMAGE_PREFIX}
# Only run pipeline for default branch, otherwise require manual approval
build:
  variables:
    DOCKERFILE: docker/uv.Dockerfile
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: always
    - if: "$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH"
      when: manual

# Disable uat, not needed
uat:
  rules:
    - when: never

# Disable prod, not needed
prod:
  rules:
    - when: never
